name: Build Microservices Project

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build User Service
        run: |
          cd user-service
          mvn clean install -DskipTests

      - name: Build User Service Docker Image
        run: |
            docker build -t aiswaryageorge01/user-service:latest ./user-service

      - name: Push User Service Docker Image
        run: |
          docker push aiswaryageorge01/user-service:latest 

      - name: Build Product Service
        run: |
          cd product-service
          mvn clean install -DskipTests

      - name: Build Product Service Docker Image
        run: |
          docker build -t aiswaryageorge01/product-service:latest ./product-service

      - name: Push Product Service Docker Image
        run: |
          docker push aiswaryageorge01/product-service:latest

      - name: Build Order Service
        run: |
          cd order-service
          mvn clean install -DskipTests

      - name: Build Payment Service
        run: |
          cd payment-service
          mvn clean install -DskipTests

      - name: Build API Gateway
        run: |
          cd api-gateway
          mvn clean install -DskipTests

      - name: Build Eureka Server
        run: |
          cd service-registry
          mvn clean install -DskipTests

      - name: Build Config Server
        run: |
          cd config-server
          mvn clean install -DskipTests